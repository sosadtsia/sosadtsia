##
# update-profile.yaml
# Regenerates static profile cards from the GitHub API and commits the PNGs.
##
---
name: Update profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  render:
    name: Render static cards
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install renderer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Test card renderer
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Render cards
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_LOGIN: sosadtsia
          FEATURED_REPOS: awake,github-manager-cli
        run: |
          set -euo pipefail
          python -m profile

      - name: Commit cards
        shell: bash
        run: |
          set -euo pipefail
          git add README.md assets
          if git diff --cached --quiet; then
            echo "profile cards unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(profile): refresh static cards"
          git push

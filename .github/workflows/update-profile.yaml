##
# update-profile.yaml
# Regenerates static profile cards from the GitHub API and commits the PNGs.
##
---
name: Update profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  render:
    name: Render static cards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install renderer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Test card renderer
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Render cards
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_LOGIN: sosadtsia
          FEATURED_REPOS: awake,github-manager-cli
        run: |
          set -euo pipefail
          python -m profile

      - name: Commit cards
        shell: bash
        run: |
          set -euo pipefail
          git add README.md assets
          if git diff --cached --quiet; then
            echo "profile cards unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(profile): refresh static cards"
          git push
